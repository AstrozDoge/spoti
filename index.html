<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Spotisaver</title>
    <!-- Standalone Tailwind engine that initializes instantly in any browser -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-black text-gray-100 flex items-center justify-center min-h-screen font-sans">

    <div class="w-full max-w-md p-8 bg-gray-900 border border-gray-800 rounded-2xl shadow-xl text-center">
        <h1 class="text-3xl font-black text-green-400 mb-2 tracking-tight">Spotisaver</h1>
        <p class="text-gray-400 text-sm mb-6">Your private cloud playlist tool</p>
        
        <div class="space-y-4">
            <input type="text" id="spotifyUrl" placeholder="Paste Spotify link here..." 
                   class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:outline-none focus:border-green-500 transition-colors text-sm text-black">
            
            <button onclick="triggerDownload()" 
                    class="w-full py-3 bg-green-500 hover:bg-green-600 text-black font-semibold rounded-xl shadow-lg transition-all active:scale-[0.98]">
                Extract & Download Track Pack
            </button>
        </div>

        <div id="status" class="hidden mt-6 text-sm text-gray-400 animate-pulse">
            Processing playlist details in the cloud...
        </div>
    </div>

    <script>
        function triggerDownload() {
            const urlInput = document.getElementById('spotifyUrl').value;
            const statusDiv = document.getElementById('status');
            
            if(!urlInput) {
                alert('Please enter a valid link!');
                return;
            }

            statusDiv.classList.remove('hidden');
            
            // Redirects straight to your repository Actions page with the input context prefilled
            alert('Redirecting to your secure cloud runner interface. Click "Run workflow" and paste your link.');
            window.location.href = "https://github.com";
        }
    </script>
</body>
</html>
